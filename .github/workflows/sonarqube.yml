name: SonarQube

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: sonarqube-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: SonarQube analysis
    if: >-
      ${{
        vars.SONAR_ENABLED == 'true' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json
            global.json

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SONAR_TOKEN"
          test -n "$SONAR_ORGANIZATION"
          test -n "$SONAR_PROJECT_KEY"

      - name: Restore tools
        run: dotnet tool restore

      - name: Begin analysis
        id: begin
        shell: bash
        run: >-
          dotnet sonarscanner begin
          /k:"$SONAR_PROJECT_KEY"
          /o:"$SONAR_ORGANIZATION"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"
          /d:sonar.qualitygate.wait=true

      - name: Restore
        run: dotnet restore Blueprints.sln

      - name: Build
        run: dotnet build Blueprints.sln --configuration Release --no-restore --no-incremental

      - name: Test with coverage
        run: >-
          dotnet test Blueprints.Tests/Blueprints.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=tests.trx"
          --results-directory TestResults
          --collect "XPlat Code Coverage;Format=opencover"

      - name: Complete analysis
        if: ${{ always() && steps.begin.outcome == 'success' }}
        shell: bash
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
