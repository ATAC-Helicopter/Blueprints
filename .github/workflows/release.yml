name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            os: windows-latest
          - runtime: linux-x64
            os: ubuntu-latest
          - runtime: osx-x64
            os: macos-latest
          - runtime: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish Blueprints.App/Blueprints.App.csproj `
            --configuration Release `
            --runtime "${{ matrix.runtime }}" `
            --self-contained true `
            --output "artifacts/${{ matrix.runtime }}" `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Create archive and checksum
        shell: pwsh
        run: |
          $archive = "Blueprints-${{ matrix.runtime }}.zip"
          Compress-Archive -Path "artifacts/${{ matrix.runtime }}/*" -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "$archive.sha256"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Blueprints-${{ matrix.runtime }}
          path: |
            Blueprints-${{ matrix.runtime }}.zip
            Blueprints-${{ matrix.runtime }}.zip.sha256
          if-no-files-found: error

  github-release:
    name: GitHub prerelease
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: Blueprints-*
          merge-multiple: true

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "${{ github.ref_name }}"
          artifacts/*
          --verify-tag
          --generate-notes
          --prerelease
          --title "Blueprints ${{ github.ref_name }}"
